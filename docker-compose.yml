version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: spark-postgres
    environment:
      POSTGRES_USER: sparkscheduler
      POSTGRES_PASSWORD: sparkscheduler_dev_password
      POSTGRES_DB: sparkscheduler_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkscheduler"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-network

  # TimescaleDB (for time-series data)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: spark-timescaledb
    environment:
      POSTGRES_USER: sparkscheduler
      POSTGRES_PASSWORD: sparkscheduler_dev_password
      POSTGRES_DB: sparkscheduler_timeseries
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkscheduler"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: spark-redis
    command: redis-server --requirepass sparkscheduler_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spark-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://sparkscheduler:sparkscheduler_dev_password@postgres:5432/sparkscheduler_dev
      TIMESCALE_URL: postgresql://sparkscheduler:sparkscheduler_dev_password@timescaledb:5432/sparkscheduler_timeseries
      REDIS_URL: redis://:sparkscheduler_redis_password@redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_EXPIRY: 24h
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    networks:
      - spark-network

  # ML Service (Python + FastAPI)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: spark-ml-service
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://sparkscheduler:sparkscheduler_dev_password@timescaledb:5432/sparkscheduler_timeseries
      REDIS_URL: redis://:sparkscheduler_redis_password@redis:6379
      MODEL_PATH: /app/models
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service:/app
      - ml_models:/app/models
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - spark-network

  # pgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spark-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sparkscheduler.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
      - timescaledb
    networks:
      - spark-network
    profiles:
      - tools

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  ml_models:
  pgadmin_data:

networks:
  spark-network:
    driver: bridge
